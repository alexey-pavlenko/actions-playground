name: Release

on:
  push:
    tags: ["v*"]                           # e.g. git tag v0.1.0 && git push --tags

permissions:
  contents: write                          # needed to create a release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact
        run: zip -r build.zip textutils.py
      - uses: actions/upload-artifact@v4   # downloadable from the run page
        with:
          name: build
          path: build.zip
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" build.zip --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup
